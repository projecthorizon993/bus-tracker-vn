<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Tracker VN - BusMap API</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header id="header">
    <h1>🚌 Bus Tracker VN</h1>
    <div class="status-bar" id="statusBar">🔴 Đang kết nối...</div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 id="cityTitle">Ho Chi Minh City</h2>
      <div class="city-subtitle" id="citySubtitle">Dữ liệu từ BusMap API</div>
    </div>
    <div class="sidebar-content">
      <!-- City Toggle -->
      <div class="section">
        <h3 class="section-title">🏙️ Thành phố</h3>
        <div class="city-toggle">
          <button id="cityHCMC" class="active">HCMC</button>
          <button id="cityHanoi">Hà Nội</button>
        </div>
      </div>

      <!-- Search -->
      <div class="section">
        <h3 class="section-title">🔍 Tìm tuyến</h3>
        <input type="text" id="routeSearch" placeholder="Nhập số tuyến (ví dụ: 01, 15)..." />
      </div>

      <!-- Routes List -->
      <div class="section">
        <h3 class="section-title">🚌 Danh sách tuyến</h3>
        <div class="bus-list" id="busList">
          <div class="empty-state">Tải dữ liệu...</div>
        </div>
      </div>

      <div class="refresh-bar">
        <button id="btnRefresh">🔄 Làm mới</button>
        <span id="lastUpdated"></span>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
