<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Tracker VN — FreeRoute Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #map-frame {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    id="map-frame"
    src="https://busmaps.com/en/maps"
    width="100%"
    height="100%"
    style="border:none;"
    allowfullscreen
    loading="lazy"
  ></iframe>
</body>
</html>
